<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h1>Log in</h1>

    <p class="alert alert-error" th:if="${param.error}">Invalid username or password</p>
    <p class="alert alert-success" th:if="${param.logout}">You have been logged out</p>

    <form class="form" th:action="@{/login}" method="post">
        <label>
            Username
            <input type="text" name="username" autofocus required>
        </label>

        <label>
            Password
            <input type="password" name="password" required>
        </label>

        <div class="actions">
            <button type="submit" class="btn">Log in</button>
        </div>
    </form>
</main>
</body>
</html>
